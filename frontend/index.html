<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Validation VPS</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #07111f; color: #eaf2ff; }
      main { width: min(42rem, calc(100% - 2rem)); padding: 2rem; background: #101d30; border: 1px solid #29405d; border-radius: 1.25rem; }
      h1 { margin-top: 0; }
      form { display: flex; gap: .75rem; }
      input { flex: 1; min-width: 0; padding: .8rem; border-radius: .6rem; border: 1px solid #47617e; background: #07111f; color: inherit; }
      button { padding: .8rem 1rem; border: 0; border-radius: .6rem; background: #52d3a2; color: #052016; font-weight: 700; cursor: pointer; }
      li { margin: .65rem 0; }
      #status { color: #9ab1ca; }
    </style>
  </head>
  <body>
    <main>
      <h1>VPS opérationnel</h1>
      <p id="status">Connexion à l’API…</p>
      <form id="note-form">
        <input id="message" maxlength="500" required placeholder="Écrire une ligne de test">
        <button>Enregistrer</button>
      </form>
      <ul id="notes"></ul>
    </main>
    <script>
      const status = document.querySelector("#status");
      const notes = document.querySelector("#notes");
      const form = document.querySelector("#note-form");
      const message = document.querySelector("#message");

      async function refresh() {
        const health = await fetch("/api/health");
        if (!health.ok) throw new Error("API indisponible");
        status.textContent = "Frontend, API et PostgreSQL communiquent correctement.";
        const response = await fetch("/api/notes");
        const data = await response.json();
        notes.replaceChildren(...data.notes.map((note) => {
          const item = document.createElement("li");
          item.textContent = `${note.message} — ${new Date(note.created_at).toLocaleString()}`;
          return item;
        }));
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const response = await fetch("/api/notes", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ message: message.value }),
        });
        if (!response.ok) throw new Error("Écriture impossible");
        message.value = "";
        await refresh();
      });

      refresh().catch((error) => { status.textContent = error.message; });
    </script>
  </body>
</html>
